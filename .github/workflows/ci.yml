name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tipo, unitarias, DB y E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Pruebas unitarias y de componentes
        run: npm test

      - name: Build de producción
        run: npm run build

      - name: Pruebas de base de datos (PostgreSQL efímero)
        run: npm run test:db

      - name: Instalar Chromium de Playwright
        run: npx playwright install --with-deps chromium

      - name: Smoke del build de producción
        run: node scripts/smoke-build.mjs

      - name: Pruebas E2E
        run: npm run test:e2e

      - name: Guardar reporte Playwright si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
